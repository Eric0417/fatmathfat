services:
  - type: web
    name: fatmathfat-api
    runtime: python
    repo: https://github.com/Eric0417/fatmathfat
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        fromDatabase:
          name: fatmathfat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_EMAILS
        value: "wongeric1417@gmail.com"
      - key: STUDENT_EMAIL_PATTERN
        value: "^[0-9]{7}-[0-9]$"
      - key: CORS_ORIGINS
        value: "https://fatmathfat.onrender.com,http://localhost:5173"
      - key: EMAIL_FROM
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_TIMEOUT_SECONDS
        value: "10"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://fatmathfat-api.onrender.com/api/auth/google/callback"
      - key: GMAIL_API_TIMEOUT_SECONDS
        value: "10"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_TIMEOUT_SECONDS
        value: "10"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: "https://api.deepseek.com"
      - key: DEEPSEEK_MODEL
        value: "deepseek-v4-flash"
      - key: DEEPSEEK_TIMEOUT_SECONDS
        value: "30"
      - key: DEEPSEEK_MAX_TOKENS
        value: "2400"
      - key: AI_DEFAULT_QUESTION_COUNT
        value: "5"

  - type: web
    name: fatmathfat
    runtime: static
    repo: https://github.com/Eric0417/fatmathfat
    branch: main
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_BASE_URL
        value: "https://fatmathfat-api.onrender.com"
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: fatmathfat-db
    plan: free
